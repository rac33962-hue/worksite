    ${recentAdLogs.length > 0 ? `
    <div class="card" style="margin-top:0">
      <div class="dash-section-title">
        최근 AI 분석 기록
        <span class="dash-more" onclick="openAdLogs()">더보기 →</span>
      </div>
      ${recentAdLogs.map(log => `
        <div class="dash-list-item" onclick="openAdLogs()">
          <span style="font-size:13px;color:var(--purple-tx)">✦</span>
          <span class="dash-item-title">${log.title}</span>
          <span class="dash-item-meta">${log.date}</span>
        </div>`).join('')}
    </div>` : ''}
  `;
}

// ═══ BOARD ═══
const BOARD_COLORS = [
  {bg:'#e8f0fe',tx:'#1a56a0',dot:'#1a56a0'},
  {bg:'#e0f5ee',tx:'#0e6b50',dot:'#0e6b50'},
  {bg:'#fde8f0',tx:'#992248',dot:'#992248'},
  {bg:'#fef3e0',tx:'#8a520a',dot:'#ba7517'},
  {bg:'#eeeefe',tx:'#4a3fb5',dot:'#4a3fb5'},
  {bg:'#fde8e8',tx:'#a02020',dot:'#a02020'},
  {bg:'#f0ede8',tx:'#4a4030',dot:'#888'},
];
let selectedBoardColor = 0;
let currentBoardId = null;
let boardView = 'list';
let boardDetailId = null;
let boardEditId = null;

function buildBoardNav() {
  const el = document.getElementById('boardNavList');
  if (!el) return;
  const boards = DB.boards || [];
  el.innerHTML = boards.map(b => `
    <div class="nav-item" id="nav-board-${b.id}" onclick="openBoard(${b.id})" style="justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="nav-dot" style="background:${b.color?.dot||'#888'}"></div>${b.name}
      </div>
      <span class="btn-icon" style="font-size:11px;color:var(--text-3);margin-left:auto;padding:2px 4px" onclick="event.stopPropagation();deleteBoardConfirm(${b.id})">✕</span>
    </div>`).join('');
}

function openBoard(id) {
  currentBoardId = id;
  boardView = 'list';
  boardDetailId = null;
  boardEditId = null;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-board')?.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-board-'+id)?.classList.add('active');
  currentPanel = 'board';
  renderBoardView();
}

function renderBoardView() {
  if (boardView === 'list') renderBoardList();
  else if (boardView === 'write') renderBoardWrite();
  else if (boardView === 'detail') renderBoardDetail();
}

function renderBoardList() {
  const el = document.getElementById('boardContainer');
  const board = (DB.boards||[]).find(b=>b.id===currentBoardId);
  if (!board) return;
  const posts = (DB.boardPosts||{})[currentBoardId] || [];
  const sorted = [...posts].sort((a,b)=>b.important-a.important||b.id-a.id);
  let num = sorted.filter(p=>!p.important).length;
  const bc = board.color || BOARD_COLORS[0];
  el.innerHTML = `
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:12px;height:12px;border-radius:50%;background:${bc.dot||'#888'};flex-shrink:0"></div>
        <h2>${board.name}</h2>
      </div>
      <button class="btn-primary" onclick="boardView='write';boardEditId=null;renderBoardView()">글쓰기</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="notice-table">
        <thead><tr>
          <th style="width:60px;text-align:center">번호</th>
          <th>제목</th>
          <th style="width:110px">날짜</th>
        </tr></thead>
        <tbody>
          ${sorted.length === 0
            ? `<tr><td colspan="3" style="text-align:center;color:var(--text-3);padding:2.5rem">게시글이 없습니다.</td></tr>`
            : sorted.map(p => {
                const rowNum = p.important
                  ? `<span class="badge" style="background:var(--red-bg);color:var(--red-tx)">중요</span>`
                  : num--;
                return `<tr class="notice-row" onclick="boardDetailId=${p.id};boardView='detail';renderBoardView()">
                  <td style="text-align:center">${rowNum}</td>
                  <td>${p.title}</td>
                  <td style="color:var(--text-3);font-size:12px">${p.date}</td>
                </tr>`;
              }).join('')}
        </tbody>
      </table>
    </div>`;
}

function renderBoardWrite() {
  const el = document.getElementById('boardContainer');
  const board = (DB.boards||[]).find(b=>b.id===currentBoardId);
  if (!board) return;
  const editTarget = boardEditId ? ((DB.boardPosts||{})[currentBoardId]||[]).find(p=>p.id===boardEditId) : null;
  el.innerHTML = `
    <div class="page-header" style="margin-bottom:1.5rem">
      <button class="btn-secondary" style="margin-bottom:.75rem" onclick="boardEditId=null;boardView='${boardEditId?'detail':'list'}';renderBoardView()">← ${boardEditId?'상세':'목록'}</button>
      <h2>${editTarget?'글 수정':'글쓰기'}</h2>
    </div>
    <div class="card">
      <div style="margin-bottom:.75rem">
        <label class="field-label">제목</label>
        <input type="text" id="boardPostTitle" placeholder="제목을 입력하세요" style="width:100%" value="${editTarget?editTarget.title:''}">
      </div>
      <div style="margin-bottom:1rem">
        <label class="field-label">내용</label>
        <div id="boardPostEditor" style="height:320px;background:#fff;border-radius:0 0 var(--radius) var(--radius)"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.5rem">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer">
          <input type="checkbox" id="boardPostImportant"${editTarget&&editTarget.important?' checked':''}> 중요 공지로 등록
        </label>
        <div style="display:flex;gap:8px">
          <button class="btn-secondary" onclick="boardEditId=null;boardView='list';renderBoardView()">취소</button>
          <button class="btn-primary" onclick="submitBoardPost()">저장</button>
        </div>
      </div>
    </div>`;

  setTimeout(() => {
    window._boardQuill = new Quill('#boardPostEditor', {
      theme: 'snow',
      placeholder: '내용을 입력하세요...',
      modules: { toolbar: [['bold','italic','underline','strike'],[{color:[]},{background:[]}],[{size:['small',false,'large','huge']}],[{align:[]}],[{list:'ordered'},{list:'bullet'}],['image','link'],['clean']] }
    });
    if (editTarget) window._boardQuill.root.innerHTML = editTarget.content || '';
    document.getElementById('boardPostEditor').addEventListener('paste', ev => {
      const items = (ev.clipboardData||ev.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          ev.preventDefault();
          const reader = new FileReader();
          reader.onload = re => { const range=window._boardQuill.getSelection(true); window._boardQuill.insertEmbed(range.index,'image',re.target.result); };
          reader.readAsDataURL(item.getAsFile());
        }
      }
    });
  }, 0);
}

function renderBoardDetail() {
  const el = document.getElementById('boardContainer');
  const posts = (DB.boardPosts||{})[currentBoardId] || [];
  const p = posts.find(p=>p.id===boardDetailId);
  if (!p) { boardView='list'; renderBoardView(); return; }
  el.innerHTML = `
    <div style="margin-bottom:1.5rem">
      <button class="btn-secondary" onclick="boardView='list';renderBoardView()">← 목록</button>
    </div>
    <div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:.4rem">
            ${p.important?`<span class="badge" style="background:var(--red-bg);color:var(--red-tx)">중요</span>`:''}
            <h2 style="font-size:17px">${p.title}</h2>
          </div>
          <div style="font-size:12px;color:var(--text-3)">${p.date}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button class="btn-secondary" onclick="boardEditId=${p.id};boardView='write';renderBoardView()">수정</button>
          <button class="btn-secondary" style="color:var(--red-tx);border-color:var(--red-tx)" onclick="deleteBoardPost(${p.id})">삭제</button>
        </div>
      </div>
      <div class="notice-detail-content">${p.content||'<span style="color:var(--text-3)">내용 없음</span>'}</div>
    </div>`;
}

function submitBoardPost() {
  const title = document.getElementById('boardPostTitle').value.trim();
  const content = window._boardQuill ? window._boardQuill.root.innerHTML : '';
  const important = document.getElementById('boardPostImportant').checked;
  if (!title) { toast('제목을 입력해주세요'); return; }
  if (!DB.boardPosts) DB.boardPosts = {};
  if (!DB.boardPosts[currentBoardId]) DB.boardPosts[currentBoardId] = [];
  const today = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.\s*/g,'.').replace(/\.$/, '');
  if (boardEditId) {
    const p = DB.boardPosts[currentBoardId].find(p=>p.id===boardEditId);
    if (p) { p.title=title; p.content=content; p.important=important; }
    boardDetailId = boardEditId;
    boardEditId = null;
    save(); window._boardQuill=null; boardView='detail'; renderBoardView();
    toast('수정됐습니다');
  } else {
    DB.boardPosts[currentBoardId].unshift({id:Date.now(),title,content,important,date:today});
    save(); window._boardQuill=null; boardView='list'; renderBoardView();
    toast('등록됐습니다');
  }
}

function deleteBoardPost(id) {
  if (!confirm('게시글을 삭제할까요?')) return;
  DB.boardPosts[currentBoardId] = (DB.boardPosts[currentBoardId]||[]).filter(p=>p.id!==id);
  save(); boardView='list'; renderBoardView(); toast('삭제됐습니다');
}

function deleteBoardConfirm(id) {
  const board = (DB.boards||[]).find(b=>b.id===id);
  if (!board) return;
  if (!confirm(`"${board.name}" 게시판을 삭제할까요?\n게시글도 모두 삭제됩니다.`)) return;
  DB.boards = (DB.boards||[]).filter(b=>b.id!==id);
  if (DB.boardPosts) delete DB.boardPosts[id];
  save(); buildBoardNav();
  if (currentBoardId === id) { currentBoardId=null; showPanel('notice'); }
  toast(`"${board.name}" 게시판이 삭제됐습니다`);
}

// 게시판 모달
function openAddBoard() {
  selectedBoardColor = 0;
  document.getElementById('boardName').value = '';
  buildBoardColorPicker();
  document.getElementById('boardModalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('boardName').focus(), 100);
}

function closeBoardModal() {
  document.getElementById('boardModalOverlay').classList.remove('open');
}

function buildBoardColorPicker() {
  const el = document.getElementById('boardColorPicker');
  el.innerHTML = BOARD_COLORS.map((c,i)=>`
    <div onclick="selectedBoardColor=${i};buildBoardColorPicker()"
      style="width:22px;height:22px;border-radius:50%;background:${c.dot};cursor:pointer;border:2px solid ${i===selectedBoardColor?'var(--text)':'transparent'};transition:border-color .1s"></div>`).join('');
}

function confirmAddBoard() {
  const name = document.getElementById('boardName').value.trim();
  if (!name) { toast('게시판 이름을 입력해주세요'); return; }
  if (!DB.boards) DB.boards = [];
  DB.boards.push({ id: Date.now(), name, color: BOARD_COLORS[selectedBoardColor] });
  save(); buildBoardNav(); closeBoardModal();
  toast(`"${name}" 게시판이 추가됐습니다`);
}

// ═══ NOTICE ═══
let noticeView = 'list';
let noticeDetailId = null;
let noticeEditId = null;
let taskView = 'list';
let taskDetailId = null;
let taskEditId = null;

  noticeView = 'list';

}

function renderNoticeView() {
  if (noticeView === 'list') renderNoticeList();

function renderNoticeList() {
  const el = document.getElementById('noticeContainer');
  const notices = DB.notices || [];
  const sorted = [...notices].sort((a,b) => b.important - a.important || b.id - a.id);

  el.innerHTML = `
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <h2>공지사항</h2>
      <button class="btn-primary" onclick="noticeView='write';renderNoticeView()">글쓰기</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="notice-table">
        <thead>
          <tr>
            <th style="width:60px;text-align:center">번호</th>
            <th>제목</th>

        </thead>
        <tbody>
          ${sorted.length === 0
            ? `<tr><td colspan="3" style="text-align:center;color:var(--text-3);padding:2.5rem">등록된 공지사항이 없습니다.</td></tr>`

function renderNoticeWrite() {
  const el = document.getElementById('noticeContainer');
  const editTarget = noticeEditId ? (DB.notices || []).find(n => n.id === noticeEditId) : null;
  el.innerHTML = `
    <div class="page-header" style="margin-bottom:1.5rem">
      <button class="btn-secondary" style="margin-bottom:.75rem" onclick="noticeEditId=null;noticeView='${noticeEditId ? 'detail' : 'list'}';renderNoticeView()">← ${noticeEditId ? '상세' : '목록'}</button>
      <h2>${editTarget ? '공지 수정' : '공지 작성'}</h2>
    </div>
    <div class="card">
      <div style="margin-bottom:.75rem">
        <label class="field-label">제목</label>
        <input type="text" id="noticeTitle" placeholder="제목을 입력하세요" style="width:100%">
      </div>
      <div style="margin-bottom:1rem">
        <label class="field-label">내용</label>
        <div id="noticeEditor" style="height:320px;background:#fff;border-radius:0 0 var(--radius) var(--radius)"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.5rem">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer">
          <input type="checkbox" id="noticeImportant"${editTarget && editTarget.important ? ' checked' : ''}> 중요 공지로 등록
        </label>
        <div style="display:flex;gap:8px">
          <button class="btn-secondary" onclick="noticeEditId=null;noticeView='list';renderNoticeView()">취소</button>
          <button class="btn-primary" onclick="submitNotice()">저장</button>
        </div>

  setTimeout(() => {
    window._noticeQuill = new Quill('#noticeEditor', {
      theme: 'snow',
      placeholder: '내용을 입력하세요...',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline', 'strike'],
          [{ color: [] }, { background: [] }],
          [{ size: ['small', false, 'large', 'huge'] }],
          [{ align: [] }],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['image', 'link'],
          ['clean']
        ]
      }
    });
    // 수정 모드: 기존 내용 불러오기
    if (editTarget) {
      window._noticeQuill.root.innerHTML = editTarget.content || '';
      document.getElementById('noticeTitle').value = editTarget.title || '';
    }
    // 이미지 붙여넣기 (클립보드)
    document.getElementById('noticeEditor').addEventListener('paste', e => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();

          reader.readAsDataURL(item.getAsFile());
        }

          <div style="display:flex;align-items:center;gap:8px;margin-bottom:.4rem">

        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button class="btn-secondary" onclick="noticeEditId=${n.id};noticeView='write';renderNoticeView()">수정</button>
          <button class="btn-secondary" style="color:var(--red-tx);border-color:var(--red-tx)" onclick="deleteNotice(${n.id})">삭제</button>
        </div>
      </div>
      <div class="notice-detail-content">${n.content || ''}</div>
    </div>`;
}

function submitNotice() {
  const title = document.getElementById('noticeTitle').value.trim();
  const content = window._noticeQuill ? window._noticeQuill.root.innerHTML : '';
  const important = document.getElementById('noticeImportant').checked;
  if (!title) { toast('제목을 입력해주세요'); return; }
  if (!DB.notices) DB.notices = [];
  if (noticeEditId) {
    const n = DB.notices.find(n => n.id === noticeEditId);
    if (n) { n.title = title; n.content = content; n.important = important; }
    noticeDetailId = noticeEditId;
    noticeEditId = null;
    save();
    window._noticeQuill = null;
    noticeView = 'detail';
    renderNoticeView();
    toast('공지가 수정됐습니다');
  } else {
    DB.notices.unshift({ id: Date.now(), title, content, important, date: new Date().toLocaleDateString('ko-KR') });
    save();
    window._noticeQuill = null;
    noticeView = 'list';
    renderNoticeView();
    toast('공지가 등록됐습니다');
  }
}

function deleteNotice(id) {
  DB.notices = DB.notices.filter(n => n.id !== id);
  save();
  noticeView = 'list';
  renderNoticeView();
  toast('공지가 삭제됐습니다');
}

// ═══ TASKS ═══
function initTasks() {
  if (!DB.tasks) DB.tasks = [];
  taskView = 'list';
  renderTaskView();
}

function renderTaskView() {
  if (taskView === 'list') renderTaskList();
  else if (taskView === 'write') renderTaskWrite();
  else if (taskView === 'detail') renderTaskDetail();
}

function renderTaskList() {
  const el = document.getElementById('tasksContainer');
  const tasks = DB.tasks || [];
  el.innerHTML = `
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <div><h2>업무일정관리</h2><div class="subtitle">외주 업무 기간 및 지시사항 관리</div></div>
      <button class="btn-primary" onclick="taskView='write';renderTaskView()">등록</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="notice-table">
        <thead>
          <tr>
            <th style="width:50px;text-align:center">번호</th>
            <th>업무명</th>
            <th style="width:120px">발주처</th>
            <th style="width:100px">마감일</th>
            <th style="width:80px;text-align:center">상태</th>
          </tr>
        </thead>
        <tbody>
          ${tasks.length === 0
            ? `<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:2.5rem">등록된 업무가 없습니다.</td></tr>`
            : tasks.map((t, i) => {
                const sc = t.status === '완료' ? 'teal' : t.status === '대기' ? 'amber' : 'blue';
                return `<tr class="notice-row" onclick="taskDetailId=${t.id};taskView='detail';renderTaskView()">
                  <td style="text-align:center">${tasks.length - i}</td>
                  <td>${t.title}</td>
                  <td style="color:var(--text-2);font-size:12px">${t.client || '—'}</td>
                  <td style="color:var(--text-3);font-size:12px">${t.deadline || '—'}</td>
                  <td style="text-align:center"><span class="badge" style="background:var(--${sc}-bg);color:var(--${sc}-tx)">${t.status}</span></td>
                </tr>`;
              }).join('')
          }
        </tbody>
      </table>
    </div>`;
}

function renderTaskWrite() {
  const el = document.getElementById('tasksContainer');
  const e = taskEditId ? (DB.tasks || []).find(t => t.id === taskEditId) : null;
  el.innerHTML = `
    <div class="page-header" style="margin-bottom:1.5rem">
      <button class="btn-secondary" style="margin-bottom:.75rem" onclick="taskEditId=null;taskView='${taskEditId ? 'detail' : 'list'}';renderTaskView()">← ${taskEditId ? '상세' : '목록'}</button>
      <h2>${e ? '업무 수정' : '업무 등록'}</h2>
    </div>
    <div class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem">
        <div>
          <label class="field-label">업무명</label>
          <input type="text" id="taskTitle" placeholder="업무명을 입력하세요" style="width:100%" value="${e ? e.title : ''}">
        </div>
        <div>
          <label class="field-label">발주처 / 클라이언트</label>
          <input type="text" id="taskClient" placeholder="발주처명" style="width:100%" value="${e ? (e.client||'') : ''}">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:.75rem">
        <div>
          <label class="field-label">시작일</label>
          <input type="date" id="taskStart" style="width:100%" value="${e ? (e.startDate||'') : ''}">
        </div>
        <div>
          <label class="field-label">마감일</label>
          <input type="date" id="taskDeadline" style="width:100%" value="${e ? (e.deadline||'') : ''}">
        </div>
        <div>
          <label class="field-label">상태</label>
          <select id="taskStatus" style="width:100%">
            ${['진행중','대기','완료'].map(s => `<option${e && e.status===s?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="margin-bottom:.75rem">
        <label class="field-label">업무내용 / 지시사항</label>
        <div id="taskEditor" style="height:280px;background:#fff;border-radius:0 0 var(--radius) var(--radius)"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:.5rem">
        <button class="btn-secondary" onclick="taskEditId=null;taskView='list';renderTaskView()">취소</button>
        <button class="btn-primary" onclick="submitTask()">저장</button>
      </div>
    </div>`;

  setTimeout(() => {
    window._taskQuill = new Quill('#taskEditor', {
      theme: 'snow',
      placeholder: '업무 내용 및 지시사항을 입력하세요...',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline', 'strike'],
          [{ color: [] }, { background: [] }],
          [{ size: ['small', false, 'large', 'huge'] }],
          [{ align: [] }],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['image', 'link'],
          ['clean']
        ]
      }
    });
    if (e) window._taskQuill.root.innerHTML = e.content || '';
    document.getElementById('taskEditor').addEventListener('paste', ev => {
      const items = (ev.clipboardData || ev.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          ev.preventDefault();
          const reader = new FileReader();
          reader.onload = re => {
            const range = window._taskQuill.getSelection(true);
            window._taskQuill.insertEmbed(range.index, 'image', re.target.result);
          };
          reader.readAsDataURL(item.getAsFile());
        }
      }
    });
  }, 0);
}

function renderTaskDetail() {
  const el = document.getElementById('tasksContainer');
  const t = (DB.tasks || []).find(t => t.id === taskDetailId);
  if (!t) { taskView = 'list'; renderTaskView(); return; }
  const sc = t.status === '완료' ? 'teal' : t.status === '대기' ? 'amber' : 'blue';
  el.innerHTML = `
    <div style="margin-bottom:1.5rem">
      <button class="btn-secondary" onclick="taskView='list';renderTaskView()">← 목록</button>
    </div>
    <div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:.4rem">
            <span class="badge" style="background:var(--${sc}-bg);color:var(--${sc}-tx)">${t.status}</span>
            <h2 style="font-size:18px">${t.title}</h2>
          </div>
          <div style="display:flex;gap:1.5rem;font-size:12px;color:var(--text-3);margin-top:.25rem">
            ${t.client ? `<span>발주처: ${t.client}</span>` : ''}
            ${t.startDate ? `<span>시작: ${t.startDate}</span>` : ''}
            ${t.deadline ? `<span style="color:var(--red-tx)">마감: ${t.deadline}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button class="btn-secondary" onclick="taskEditId=${t.id};taskView='write';renderTaskView()">수정</button>
          <button class="btn-secondary" style="color:var(--red-tx);border-color:var(--red-tx)" onclick="deleteTask(${t.id})">삭제</button>
        </div>
      </div>
      <div class="notice-detail-content">${t.content || '<span style="color:var(--text-3)">내용 없음</span>'}</div>
    </div>`;
}

function submitTask() {
  const title = document.getElementById('taskTitle').value.trim();
  const client = document.getElementById('taskClient').value.trim();
  const startDate = document.getElementById('taskStart').value;
  const deadline = document.getElementById('taskDeadline').value;
  const content = window._taskQuill ? window._taskQuill.root.innerHTML : '';
  const status = document.getElementById('taskStatus').value;
  if (!title) { toast('업무명을 입력해주세요'); return; }
  if (!DB.tasks) DB.tasks = [];
  if (taskEditId) {
    const t = DB.tasks.find(t => t.id === taskEditId);
    if (t) { t.title = title; t.client = client; t.startDate = startDate; t.deadline = deadline; t.content = content; t.status = status; }
    taskDetailId = taskEditId;
    taskEditId = null;
    save();
    window._taskQuill = null;
    taskView = 'detail';
    renderTaskView();
    toast('업무가 수정됐습니다');
  } else {
    DB.tasks.unshift({ id: Date.now(), title, client, startDate, deadline, content, status });
    save();
    window._taskQuill = null;
    taskView = 'list';
    renderTaskView();
    toast('업무가 등록됐습니다');
  }
}

function deleteTask(id) {
  if (!confirm('업무를 삭제할까요?')) return;
  DB.tasks = DB.tasks.filter(t => t.id !== id);
  save();
  taskView = 'list';
  renderTaskView();
  toast('업무가 삭제됐습니다');
}

// ═══ TOAST ═══
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  setTimeout(() => el.style.opacity='0', 2200);
}

// ═══ INIT ═══
buildColorPicker();
fetch(`${API_URL}?action=getMembers`)
  .then(r => r.json())
  .then(res => {
    if (res.ok && res.data.length) {
      DB.members = res.data.map((m, i) => ({
        id: m['ID'] || 'mb_'+i,
        name: m['이름'] || '',
        status: m['상태']==='육아휴직' ? 'leave' : 'active',
        color: COLORS[i % COLORS.length],
        type: (m['이름']==='공수진') ? 'marketing' : 'design'
      }));
      save();
    }
    buildMemberTabs();
    buildMemberPanels();
    buildBoardNav();
    showPanel('notice');
  })
  .catch(() => {
    buildMemberTabs();
    buildMemberPanels();
    buildBoardNav();
    showPanel('notice');
  });
</script>
</body>
</html>
