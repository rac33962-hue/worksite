<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 업무 보고 | Team Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<style>
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.09);
  --border-strong: rgba(0,0,0,0.18);
  --text: #1a1a1a;
  --text-2: #5a5a5a;
  --text-3: #999;
  --accent: #1a1a1a;
  --accent-light: #f0ede8;
  --blue-bg: #e8f0fe; --blue-tx: #1a56a0;
  --teal-bg: #e0f5ee; --teal-tx: #0e6b50;
  --pink-bg: #fde8f0; --pink-tx: #992248;
  --amber-bg: #fef3e0; --amber-tx: #8a520a;
  --purple-bg: #eeeefe; --purple-tx: #4a3fb5;
  --red-bg: #fde8e8; --red-tx: #a02020;
  --radius: 10px; --radius-lg: 16px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

/* LAYOUT */
.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; top: 0; bottom: 0; left: 0; overflow-y: auto; z-index: 10; }
.main { margin-left: 220px; padding: 2rem; flex: 1; }

/* SIDEBAR */
.sidebar-logo { padding: 1.5rem 1.25rem 1rem; border-bottom: 1px solid var(--border); }
.sidebar-logo .brand { font-family: 'DM Serif Display', serif; font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.sidebar-logo .sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

.week-nav { padding: .75rem 1rem; border-bottom: 1px solid var(--border); }
.week-nav-label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; letter-spacing: .05em; text-transform: uppercase; }
.week-ctrl { display: flex; align-items: center; gap: 6px; }
.week-ctrl button { background: transparent; border: 1px solid var(--border-strong); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 13px; color: var(--text-2); font-family: inherit; }
.week-ctrl button:hover { background: var(--bg); }
.week-lbl { flex: 1; font-size: 12px; font-weight: 500; color: var(--text); text-align: center; }

.nav-section { padding: .625rem 1rem .25rem; font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: .5rem 1rem; cursor: pointer; font-size: 13px; color: var(--text-2); border-left: 3px solid transparent; transition: all .15s; }
.nav-item:hover { color: var(--text); background: var(--bg); }
.nav-item.active { color: var(--text); background: var(--accent-light); border-left-color: var(--text); font-weight: 500; }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.nav-item.locked { opacity: .6; }
.nav-item.locked::after { content: '🔒'; font-size: 10px; margin-left: auto; }

.sidebar-footer { margin-top: auto; padding: 1rem; border-top: 1px solid var(--border); }
.btn-add-member { width: 100%; padding: 7px; background: var(--text); color: #fff; border: none; border-radius: var(--radius); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; }
.btn-add-member:hover { opacity: .85; }

/* PAGE HEADER */
.page-header { margin-bottom: 1.75rem; }
.page-header h2 { font-size: 22px; font-weight: 700; color: var(--text); }
.page-header .subtitle { font-size: 13px; color: var(--text-2); margin-top: 4px; }

/* CARDS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
.card-title { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1rem; }

.field-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; display: block; font-weight: 500; }
textarea, input[type=text], input[type=number], input[type=password], select {
  font-family: inherit; font-size: 13px; padding: 7px 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  background: var(--surface); color: var(--text); outline: none;
  transition: border-color .15s;
}
textarea:focus, input:focus, select:focus { border-color: var(--text); }
textarea { width: 100%; resize: vertical; line-height: 1.6; min-height: 70px; }
input[type=number] { -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

.btn-primary { background: var(--text); color: #fff; border: none; border-radius: var(--radius); padding: 9px 18px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
.btn-primary:hover { opacity: .85; }
.btn-secondary { background: transparent; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 7px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; font-family: inherit; }
.btn-secondary:hover { background: var(--bg); }
.btn-full { width: 100%; }
.btn-icon { background: transparent; border: none; cursor: pointer; color: var(--text-3); padding: 3px 6px; font-size: 16px; }
.btn-icon:hover { color: var(--text); }
.btn-add { background: transparent; border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 5px 12px; font-size: 12px; color: var(--text-3); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
.btn-add:hover { color: var(--text); border-color: var(--text); }

/* BRAND ROW */
.brand-row { display: grid; gap: 8px; align-items: center; margin-bottom: 8px; }
.brand-row-3 { grid-template-columns: 1fr 70px 70px 28px; }
.brand-row-2 { grid-template-columns: 1fr 110px 28px; }
.brand-row select { width: 100%; }
.brand-row input[type=number] { text-align: center; width: 100%; }
.col-hdr { display: grid; gap: 8px; margin-bottom: 4px; }
.col-hdr span { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }

.divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

/* BADGE */
.badge { font-size: 11px; padding: 2px 9px; border-radius: 20px; display: inline-flex; align-items: center; }

/* PANEL */
.panel { display: none; }
.panel.active { display: block; }
.member-panel { display: none; }
.member-panel.active { display: block; }

/* NOTICE */
.notice-table { width:100%; border-collapse:collapse; }
.notice-table th { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; padding:.75rem 1rem; border-bottom:1px solid var(--border); text-align:left; font-weight:600; }
.notice-table td { padding:.85rem 1rem; border-bottom:1px solid var(--border); font-size:13px; color:var(--text); }
.notice-table tbody tr:last-child td { border-bottom:none; }
.notice-row { cursor:pointer; transition:background .1s; }
.notice-row:hover { background:var(--bg); }
.notice-detail-content { font-size:14px; line-height:1.9; color:var(--text); min-height:200px; }
.notice-detail-content img { max-width:100%; height:auto; border-radius:var(--radius); margin:.5rem 0; }
.notice-detail-content table { border-collapse:collapse; width:100%; margin:.5rem 0; }
.notice-detail-content td, .notice-detail-content th { border:1px solid var(--border-strong); padding:6px 10px; font-size:13px; }

/* TASKS */
.task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: .75rem; }
.task-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: .5rem; }
.task-title { font-size: 14px; font-weight: 600; color: var(--text); }
.task-dates { display: flex; gap: 1rem; font-size: 12px; color: var(--text-3); margin-bottom: .5rem; }
.task-body { font-size: 13px; color: var(--text-2); line-height: 1.6; white-space: pre-wrap; }
.task-status-sel { font-family: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; }

/* LOCK SCREEN */
.lock-screen { max-width: 360px; margin: 0 auto; padding-top: 3rem; text-align: center; }
.lock-icon { font-size: 40px; margin-bottom: 1.25rem; }
.lock-screen h3 { font-size: 18px; font-weight: 600; margin-bottom: .5rem; }
.lock-screen p { font-size: 13px; color: var(--text-2); margin-bottom: 1.5rem; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input { flex: 1; }
.lock-error { font-size: 12px; color: #e24b4b; margin-top: 8px; min-height: 18px; }

/* SUMMARY CARD */
.sum-wrap { max-width: 800px; }
.sum-export-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem; }
.sum-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--text); }
.sum-title-block .company { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); }
.sum-title-block .week { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.sum-badge-report { background: var(--text); color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 4px; font-weight: 500; }

.sum-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.sum-stat { background: var(--bg); border-radius: var(--radius); padding: .875rem; text-align: center; }
.sum-stat .val { font-size: 18px; font-weight: 700; color: var(--text); }
.sum-stat .lbl { font-size: 11px; color: var(--text-3); margin-top: 3px; }

.sum-section { margin-bottom: 1.25rem; }
.sum-section-title { font-size: 11px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .07em; border-left: 3px solid var(--text); padding-left: 8px; margin-bottom: .75rem; }
.sum-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.sum-table th { font-size: 11px; color: var(--text-3); text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); font-weight: 500; }
.sum-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
.sum-table tr:last-child td { border-bottom: none; }
.sum-lines { font-size: 13px; line-height: 1.9; color: var(--text); white-space: pre-wrap; }
.sum-empty { font-size: 13px; color: var(--text-3); }
.sum-person-block { margin-bottom: .5rem; }
.sum-person-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.sum-person-items { font-size: 13px; color: var(--text-2); padding-left: 10px; line-height: 1.8; }

.export-btns { display: flex; gap: 10px; margin-bottom: 1.25rem; }

/* MEMBER MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius-lg); padding: 1.75rem; width: 380px; max-width: 90vw; }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }
.modal-field { margin-bottom: 1rem; }
.modal-field label { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 5px; }
.modal-field input, .modal-field select { width: 100%; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
.color-picker-row { display: flex; gap: 8px; flex-wrap: wrap; }
.color-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color .15s; }
.color-opt.sel { border-color: var(--text); }

/* TOAST */
#toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 9px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200; white-space: nowrap; }

/* WEEK ACCORDION */
/* 아코디언 CSS 제거 (주간보고 월 그리드로 전환) */

/* MEMBER TABS */
.member-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
.member-tab { padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); font-family: inherit; transition: all .15s; }
.member-tab:hover { background: var(--bg); }
.member-tab.active { background: var(--text); color: #fff; border-color: var(--text); }

/* STORE LIST */
.store-list-row { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 10px; }
.store-list-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: .75rem; display: flex; align-items: center; }
.store-list-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.store-input-group { display: flex; flex-direction: column; gap: 4px; }
.store-input-group label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.store-input-group input { font-size: 13px; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); width: 100%; }
.store-input-group span { font-size: 11px; color: var(--text-3); }

/* STORE TABS */
.store-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
.store-tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); font-family: inherit; transition: all .15s; white-space: nowrap; }
.store-tab:hover { background: var(--bg); color: var(--text); }
.store-tab.active { background: var(--text); color: #fff; border-color: var(--text); }
.store-tab.add-tab { border-style: dashed; color: var(--text-3); }
.store-tab.add-tab:hover { color: var(--text); border-color: var(--text); }
.store-panel { display: none; }
.store-panel.active { display: block; }
.store-amt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
.store-amt-row label { font-size: 12px; color: var(--text-2); min-width: 60px; }
.store-amt-row input { flex: 1; max-width: 200px; }
.store-amt-row .unit { font-size: 13px; color: var(--text-3); }
.store-orders-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
.store-orders-row label { font-size: 12px; color: var(--text-2); min-width: 60px; }
.store-orders-row input { flex: 1; max-width: 120px; }
.store-orders-row .unit { font-size: 13px; color: var(--text-3); }
.store-note-row { margin-bottom: .5rem; }

/* MONTH CARD GRID */
.month-card { cursor:pointer; padding:1rem; transition:box-shadow .15s, border-color .15s; }
.month-card:hover { box-shadow:0 4px 14px rgba(0,0,0,0.09); border-color:var(--border-strong); }
.month-card.empty { background:var(--bg); border-style:dashed; }
.month-card.empty:hover { border-color:var(--text-2); }

/* AD ANALYSIS */
.ad-result-section { margin-bottom:1.25rem; }
.ad-result-h2 { font-size:13px; font-weight:700; color:var(--text); border-left:3px solid var(--text); padding-left:9px; margin:1.5rem 0 .6rem; text-transform:uppercase; letter-spacing:.04em; }
.ad-result-h3 { font-size:13px; font-weight:600; color:var(--text-2); margin:.875rem 0 .3rem; }
.ad-result-body { font-size:13px; line-height:1.85; color:var(--text); white-space:pre-wrap; }
.ad-result-body li { margin:.15rem 0; padding-left:.25rem; }
.ad-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem; gap:.75rem; }
.ad-loading-dot { width:8px; height:8px; border-radius:50%; background:var(--text); animation:adPulse 1.2s ease-in-out infinite; }
.ad-loading-dot:nth-child(2) { animation-delay:.2s; }
.ad-loading-dot:nth-child(3) { animation-delay:.4s; }
.ad-loading-dots { display:flex; gap:6px; }
@keyframes adPulse { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

/* DASHBOARD */
.dash-stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.5rem; }
.dash-stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.25rem 1.5rem; cursor:pointer; transition:box-shadow .15s, border-color .15s; }
.dash-stat-card:hover { box-shadow:0 4px 14px rgba(0,0,0,0.09); border-color:var(--border-strong); }
.dash-stat-val { font-size:30px; font-weight:700; color:var(--text); margin-bottom:.2rem; }
.dash-stat-lbl { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; }
.dash-stat-icon { font-size:20px; margin-bottom:.5rem; }
.dash-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.dash-section-title { font-size:12px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.875rem; display:flex; align-items:center; justify-content:space-between; }
.dash-more { font-size:11px; color:var(--text-3); cursor:pointer; font-weight:400; text-transform:none; letter-spacing:0; }
.dash-more:hover { color:var(--text); }
.dash-list-item { display:flex; align-items:center; gap:8px; padding:.6rem 0; border-bottom:1px solid var(--border); cursor:pointer; }
.dash-list-item:last-child { border-bottom:none; padding-bottom:0; }
.dash-list-item:hover .dash-item-title { color:var(--text); }
.dash-item-title { font-size:13px; color:var(--text-2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .1s; }
.dash-item-meta { font-size:11px; color:var(--text-3); flex-shrink:0; }
.dash-empty { font-size:13px; color:var(--text-3); padding:1.5rem 0; text-align:center; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; }
  .main { margin-left: 0; padding: 1rem; }
  .sum-stat-row { grid-template-columns: 1fr 1fr; }
}
@media print {
  .sidebar, .btn-secondary, .btn-primary, button { display: none !important; }
  .main { margin-left: 0 !important; padding: 1rem !important; }
  .panel { display: block !important; }
  .panel:not(.active) { display: none !important; }
  #adReportPrintArea { box-shadow: none !important; border: none !important; }
  body { background: #fff !important; }
}
</style>
</head>
<body>

<div class="app-shell">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo" style="cursor:pointer" onclick="showPanel('home')">
      <div class="brand">Worksite</div>
      <div class="sub">팀 워크사이트</div>
    </div>

    <div class="nav-section" style="display:flex;align-items:center;justify-content:space-between">
      <span>📢 게시판</span>
      <span style="cursor:pointer;font-size:16px;color:var(--text-3);line-height:1;padding:0 2px" onclick="openAddBoard()" title="게시판 추가">+</span>
    </div>
    <div class="nav-item" id="nav-notice" onclick="showPanel('notice')">
      <div class="nav-dot" style="background:#0e6b50"></div>공지사항
    </div>
    <div id="boardNavList"></div>

    <div class="nav-section" style="margin-top:.5rem">📁 업무일정</div>
    <div class="nav-item" id="nav-tasks" onclick="showPanel('tasks')">
      <div class="nav-dot" style="background:#4a3fb5"></div>업무일정관리
    </div>

    <div class="nav-section" style="margin-top:.5rem">📊 광고</div>
    <div class="nav-item" id="nav-adreport" onclick="showPanel('adreport')">
      <div class="nav-dot" style="background:#0e6b50"></div>통합보고서
    </div>
    <div class="nav-item" id="nav-insta" onclick="showPanel('insta')">
      <div class="nav-dot" style="background:#992248"></div>인스타그램
    </div>
    <div class="nav-item" id="nav-naver" onclick="showPanel('naver')">
      <div class="nav-dot" style="background:#1a56a0"></div>네이버
    </div>
    <div class="nav-item" id="nav-kakao" onclick="showPanel('kakao')">
      <div class="nav-dot" style="background:#ba7517"></div>카카오
    </div>

    <div class="nav-section" style="margin-top:.5rem">📋 주간보고</div>
    <div class="nav-item" id="nav-report" onclick="showPanel('report')">
      <div class="nav-dot" style="background:#1a1a1a"></div>주간보고
    </div>
    <div class="nav-item locked" id="nav-ad" onclick="openLocked('ad')">
      <div class="nav-dot" style="background:#4a3fb5"></div>AI 광고분석
    </div>

    <div class="nav-section" style="margin-top:.5rem">관리자</div>
    <div class="nav-item locked" id="nav-mgr" onclick="openLocked('mgr')">
      <div class="nav-dot" style="background:#ba7517"></div>관리자 메모
    </div>
    <div class="nav-item locked" id="nav-sum" onclick="openLocked('sum')">
      <div class="nav-dot" style="background:#1a56a0"></div>최종 요약본
    </div>

    <div class="sidebar-footer">

<script>
// ═══ DATA ═══
const ADMIN_PW = '1234';
const API_URL = 'https://script.google.com/macros/s/AKfycbybpuqrd5F9LXOJyGyTSk3JqJf6AAKniyl-zhKYvuHpR2u0QnFPQS3o14KR_HPFFZlk/exec';
const COLORS = [
  {bg:'#e8f0fe',tx:'#1a56a0',name:'blue'},
  {bg:'#e0f5ee',tx:'#0e6b50',name:'teal'},
  {bg:'#fde8f0',tx:'#992248',name:'pink'},
  {bg:'#fef3e0',tx:'#8a520a',name:'amber'},
  {bg:'#eeeefe',tx:'#4a3fb5',name:'purple'},
  {bg:'#fde8e8',tx:'#a02020',name:'red'},
  {bg:'#f0ede8',tx:'#4a4030',name:'sand'},
];
const STORES_FIXED = [
  '나인원코스메디 스마트스토어',
  '나인원코스메디 공식몰',
  '셀린비 스마트스토어',
  '루아 스마트스토어',
  '에이엔케이 스토어',
];
const BRANDS_DESIGN = ['나인원 공식&리블','홈페이지','나인원 브랜드','외주','셀린비','바이탈메디','설오담','시어스','기타'];
const STATUSES = ['진행중','완료','모집중','컨펌중','진행예정'];

let DB;
try {
  DB = JSON.parse(localStorage.getItem('teamreport_v3') || 'null') || { members: [], weeks: {} };
  if (!DB.members || !Array.isArray(DB.members)) DB = { members: [], weeks: {} };
} catch(e) { DB = { members: [], weeks: {} }; }
let wOff = 0;
let selectedColor = COLORS[0];

// Init default members if empty
if (DB.members.length === 0) {
  DB.members = [
    { id:'gong', name:'공수진', role:'마케팅', color:COLORS[0], status:'active', type:'marketing' },
    { id:'kh',   name:'구현희', role:'디자인',  color:COLORS[1], status:'active', type:'design'    },
    { id:'sg',   name:'서귀복', role:'디자인',  color:COLORS[3], status:'active', type:'design'    },
    { id:'bh',   name:'배현호', role:'디자인',  color:COLORS[4], status:'active', type:'design'    },
    { id:'yi',   name:'이영인', role:'디자인',  color:COLORS[2], status:'leave',  type:'design'    },
  ];
  save();
}

function save() { localStorage.setItem('teamreport_v3', JSON.stringify(DB)); }
function wKey(off=wOff) {
  const d = new Date(); d.setDate(d.getDate() + off*7);
  const y = d.getFullYear();
  const wn = getWeekNum(d);
  return `${y}-W${String(wn).padStart(2,'0')}`;
}
function getWeekNum(d) {
  const onejan = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
}
function wRange(off=wOff) {
  const d = new Date(); const dy = d.getDay();
  const mon = new Date(d); mon.setDate(d.getDate() - (dy===0?6:dy-1) + off*7);
  const fri = new Date(mon); fri.setDate(mon.getDate()+4);
  const fmt = dt => `${dt.getMonth()+1}/${dt.getDate()}`;
  return `${mon.getFullYear()}년 ${fmt(mon)}–${fmt(fri)}`;
}
function gw() { return DB.weeks[wKey()] || {}; }
function sw2(obj) {
  if (!DB.weeks[wKey()]) DB.weeks[wKey()] = {};
  Object.assign(DB.weeks[wKey()], obj);
  save();
}
function getMemberData(mid) { return (gw().members || {})[mid] || {}; }
function setMemberData(mid, obj) {
  const w = DB.weeks[wKey()] || {};
  if (!w.members) w.members = {};
  w.members[mid] = Object.assign(w.members[mid] || {}, obj);
  DB.weeks[wKey()] = w;
  save();
}

// ═══ NAV ═══
function chW(dir) { wOff += dir; reloadAll(); }

let currentPanel = null;
let currentMember = null;

function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + id)?.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + id)?.classList.add('active');
  currentPanel = id;
  if (id === 'home') initDashboard();
  if (id === 'report') initReportNav();
  if (id === 'notice') initNotice();
  if (id === 'tasks') initTasks();
  if (id === 'insta') initInsta();
  if (id === 'naver') initNaver();
  if (id === 'kakao') initKakao();
  if (id === 'adreport') initAdReport();
}


let reportNavYear = new Date().getFullYear();

function initReportNav() {
  document.getElementById('reportNavContainer').style.display = '';
  document.getElementById('reportWeekView').style.display = 'none';
  renderReportNav();
}

function renderReportNav() {
  const el = document.getElementById('reportNavContainer');
  const savedKeys = getSavedWeekKeys();
  const curKey = wKey(0);
  const nextKey = wKey(1);
  const allKeys = [...new Set([...savedKeys, curKey, nextKey])];

  // 연도 목록
  const years = [...new Set(allKeys.map(k => wKeyToDate(k).getFullYear()))].sort((a,b)=>b-a);
  if (!years.includes(reportNavYear)) reportNavYear = years[0] || new Date().getFullYear();

  // 현재 연도의 월별 그룹
  const monthMap = {};
  allKeys.forEach(k => {
    const d = wKeyToDate(k);
    if (d.getFullYear() !== reportNavYear) return;
    const mo = d.getMonth() + 1;
    if (!monthMap[mo]) monthMap[mo] = [];
    monthMap[mo].push(k);
  });

  el.innerHTML = `
    <div class="page-header" style="margin-bottom:1.5rem">
      <h2>주간보고</h2>
      <div class="subtitle">월을 선택하면 해당 주차 보고서를 볼 수 있습니다</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem">
      ${years.map(y => `
        <button class="${y===reportNavYear?'btn-primary':'btn-secondary'}" style="padding:5px 14px;font-size:12px"
          onclick="reportNavYear=${y};renderReportNav()">${y}년</button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem">
      ${Array.from({length:12},(_,i)=>i+1).map(m => {
        const weeks = (monthMap[m]||[]).sort();
        const hasData = weeks.some(k => DB.weeks[k] && Object.keys(DB.weeks[k].members||{}).length);
        return `<div class="card" style="padding:1rem;cursor:pointer;border:1px solid var(--border);transition:box-shadow .15s${!weeks.length?';opacity:.4':''}"
          onclick="${weeks.length ? `openReportMonth(${reportNavYear},${m})` : ''}"
          onmouseenter="${weeks.length?"this.style.boxShadow='0 4px 14px rgba(0,0,0,0.09)'":''}"
          onmouseleave="this.style.boxShadow=''">
          <div style="font-size:11px;color:var(--text-3);margin-bottom:.3rem">${m}월</div>
          ${weeks.length
            ? `<div style="font-size:14px;font-weight:600;color:var(--text)">${weeks.length}주</div>
               <div style="font-size:11px;color:var(--text-3);margin-top:2px">${hasData?'보고서 있음':'미작성'}</div>`
            : `<div style="font-size:13px;color:var(--text-3)">없음</div>`}
        </div>`;
      }).join('')}
    </div>`;
}

function openReportMonth(year, month) {
  // 해당 월의 주차 중 가장 최신 주차로 이동
  const allKeys = [...new Set([...getSavedWeekKeys(), wKey(0), wKey(1)])];
  const monthWeeks = allKeys.filter(k => {
    const d = wKeyToDate(k);
    return d.getFullYear() === year && d.getMonth()+1 === month;
  }).sort().reverse();
  if (!monthWeeks.length) return;
  // 현재 주와 가장 가까운 주차 선택
  const target = monthWeeks[0];
  let off = 0;
  for (let i = -104; i <= 52; i++) {
    if (wKey(i) === target) { off = i; break; }
  }
  wOff = off;
  showReportPanel();
  // weekSelect를 해당 월의 주차들만 보여주도록 업데이트
  updateWeekSelectForMonth(year, month, monthWeeks);
}

function updateWeekSelectForMonth(year, month, monthWeeks) {
  const sel = document.getElementById('weekSelect');
  const curKey = wKey();
  sel.innerHTML = monthWeeks.map(k => `<option value="${k}"${k===curKey?' selected':''}>${wKeyToWeekLabel(k)}</option>`).join('');
}

function showReportNav() {
  document.getElementById('reportNavContainer').style.display = '';
  document.getElementById('reportWeekView').style.display = 'none';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-report')?.classList.add('active');
}

function onWeekSelect(val) {
  let off = 0;
  for (let i = -104; i <= 52; i++) {
    if (wKey(i) === val) { off = i; break; }
  }
  wOff = off;
  showReportPanel();
}

function showReportPanel() {
  // 패널 활성화
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-report')?.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-report')?.classList.add('active');
  currentPanel = 'report';

  document.getElementById('reportNavContainer').style.display = 'none';
  document.getElementById('reportWeekView').style.display = '';
  document.getElementById('reportWeekLabel').textContent = wRange();
  document.getElementById('reportTitle').textContent = `${wRange()} 주간 보고`;
  buildMemberTabs();
  buildMemberPanels();
  updateWeekSelect();
  if (currentMember) {
    const m = DB.members.find(x => x.id === currentMember);
    if (m) selectMemberTab(currentMember);
    else selectMemberTab(DB.members[0]?.id);
  } else {
    selectMemberTab(DB.members[0]?.id);
  }
}

function wKeyToDate(k) {
  // "2025-W15" → 해당 주 월요일 Date 반환
  const [year, w] = k.split('-W').map(Number);
  const jan4 = new Date(year, 0, 4);
  const startOfWeek1 = new Date(jan4);
  startOfWeek1.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1);
  const mon = new Date(startOfWeek1);
  mon.setDate(startOfWeek1.getDate() + (w - 1) * 7);
  return mon;
}

function wKeyToMonthLabel(k) {
  const d = wKeyToDate(k);
  return `${d.getMonth()+1}월`;
}

function wKeyToWeekLabel(k) {
  const d = wKeyToDate(k);
  // 해당 월의 몇째 주인지
  const weekOfMonth = Math.ceil(d.getDate() / 7);
  return `${d.getMonth()+1}월 ${weekOfMonth}주차`;
}

function buildWeekList() { /* 사이드바 아코디언 제거됨 — renderReportNav() 사용 */ }

function getSavedWeekKeys() {
  return Object.keys(DB.weeks).sort().reverse();
}

function updateWeekSelect() {
  const sel = document.getElementById('weekSelect');
  if (!sel) return;
  const curKey = wKey();
  const d = wKeyToDate(curKey);
  const year = d.getFullYear(), month = d.getMonth()+1;
  const allKeys = [...new Set([...getSavedWeekKeys(), curKey, wKey(1)])];
  const monthWeeks = allKeys.filter(k => {
    const kd = wKeyToDate(k);
    return kd.getFullYear()===year && kd.getMonth()+1===month;
  }).sort().reverse();
  if (!monthWeeks.includes(curKey)) monthWeeks.unshift(curKey);
  sel.innerHTML = monthWeeks.map(k => `<option value="${k}"${k===curKey?' selected':''}>${wKeyToWeekLabel(k)}</option>`).join('');
}

function weekKeyToLabel(k) {
  return wKeyToWeekLabel(k);
}

// ═══ MEMBER TABS ═══
function buildMemberTabs() {
  const el = document.getElementById('memberTabs');
  el.innerHTML = DB.members.map(m =>
    `<button class="member-tab${m.status==='leave'?' opacity-50':''}" id="mtab-${m.id}" onclick="selectMemberTab('${m.id}')">${m.name}${m.status==='leave'?' (휴직)':''}</button>`
  ).join('');
}

function selectMemberTab(mid) {
  currentMember = mid;
  document.querySelectorAll('.member-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('mtab-' + mid)?.classList.add('active');
  document.querySelectorAll('.member-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('mpanel-' + mid)?.classList.add('active');
  loadMemberPanel(mid);
}

// ═══ MEMBER PANELS ═══
function buildMemberPanels() {
  const cont = document.getElementById('panelsContainer');
  cont.innerHTML = '';
  DB.members.forEach(m => {
    const div = document.createElement('div');
    div.className = 'member-panel';
    div.id = 'mpanel-' + m.id;
    cont.appendChild(div);
  });
}

function loadMemberPanel(mid) {
  const m = DB.members.find(x => x.id === mid);
  if (!m) return;
  const panel = document.getElementById('mpanel-' + mid);
  if (!panel) return;
  if (!m.color || typeof m.color !== 'object') m.color = COLORS[0];
  const d = getMemberData(mid);
  const isLeave = m.status === 'leave';

  panel.innerHTML = `
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:50%;background:${m.color.bg};color:${m.color.tx};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${m.name[0]}</div>
        <div>
          <h2>${m.name}</h2>
          <div class="subtitle">${m.role}${isLeave?' · 육아휴직 중':''}</div>
        </div>
      </div>
    </div>
    ${isLeave ? '<div class="card"><p style="color:var(--text-2);font-size:13px">육아휴직 중인 팀원입니다. 복직 후 보고서 작성이 가능합니다.</p></div>' : buildMemberForm(m, d)}`;
}

function buildMemberForm(m, d) {
  if (m.type === 'marketing') return buildMktForm(d);
  return buildDesignForm(d);
}

function buildMktForm(d) {
  const customStores = d.customStores || [];
  const allStores = [...STORES_FIXED, ...customStores];
  const storeData = d.storeData || {};
  const exp = (d.exp || [{ name: '', qty: '', status: '진행중' }]);

  const storeListHtml = allStores.map(s => {
    const sd = storeData[s] || {};
    const isCustom = !STORES_FIXED.includes(s);
    return `<div class="store-list-row">
      <div class="store-list-name">${s}${isCustom ? `<button class="btn-icon" style="font-size:12px;margin-left:4px" onclick="removeStore('${encodeURIComponent(s)}')">×</button>` : ''}</div>
      <div class="store-list-inputs">
        <div class="store-input-group"><label>주간매출</label><input type="number" class="store-amt" data-store="${encodeURIComponent(s)}" value="${sd.amt||''}" placeholder="0"><span>원</span></div>
        <div class="store-input-group"><label>월매출</label><input type="number" class="store-monthly" data-store="${encodeURIComponent(s)}" value="${sd.monthly||''}" placeholder="0"><span>원</span></div>
        <div class="store-input-group"><label>발주</label><input type="number" class="store-orders" data-store="${encodeURIComponent(s)}" value="${sd.orders||''}" placeholder="0"><span>건</span></div>
        <div class="store-input-group" style="grid-column:1/-1"><label>메모</label><input type="text" class="store-memo" data-store="${encodeURIComponent(s)}" value="${sd.memo||''}" placeholder="특이사항..."></div>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-title">스마트스토어 매출</div>
      <div id="storeList">${storeListHtml}</div>
      <button class="btn-add" style="margin-top:8px" onclick="addStoreRow()">+ 스토어 추가</button>

      <div class="card-title">기타 주요 업무</div>
      <textarea id="mktEtc" placeholder="광고, SNS, 언론기사, 온라인 단속 등...">${d.mktEtc||''}</textarea>
    </div>
    <button class="btn-primary btn-full" style="max-width:200px" onclick="saveMktPanel()">저장</button>`;
}

function addStoreRow() {
  const name = prompt('추가할 스토어 이름을 입력하세요');
  if (!name || !name.trim()) return;
  const mid = currentPanel;
  const d = getMemberData(mid);
  const custom = d.customStores || [];
  if ([...STORES_FIXED, ...custom].includes(name.trim())) { toast('이미 존재하는 스토어입니다'); return; }
  custom.push(name.trim());
  setMemberData(mid, { customStores: custom });
  loadMemberPanel(mid);
}

function removeStore(encodedName) {
  const name = decodeURIComponent(encodedName);
  if (!confirm(`"${name}" 삭제할까요?`)) return;
  const mid = currentPanel;
  const d = getMemberData(mid);
  const custom = (d.customStores || []).filter(s => s !== name);
  const storeData = d.storeData || {};
  delete storeData[name];
  setMemberData(mid, { customStores: custom, storeData });
  loadMemberPanel(mid);
}

function saveMktPanel() {
  const mid = currentPanel;

function unlock(panelId) {

// ═══ SUMMARY ═══
function buildSummary() {
  document.getElementById('sumSubtitle').textContent = wRange();
  const w = gw();
  let totalSales = 0;
  const salesLines = [];
  let totalExp = 0;
  const expLines = [];
  const dsummary = {};

  DB.members.forEach(m => {
    const d = (w.members || {})[m.id] || {};
    if (m.type === 'marketing') {
      // New store-tab format
      const customStores = d.customStores || [];
      const allStores = [...STORES_FIXED, ...customStores];
      const storeData = d.storeData || {};
      allStores.forEach(s => {
        const sd = storeData[s] || {};
        const v = parseInt(sd.amt) || 0;
        totalSales += v;
        const orders = parseInt(sd.orders) || 0;
        const memo = sd.memo ? ` (${sd.memo})` : '';
        salesLines.push(`${s}: ${v.toLocaleString()}원, 발주 ${orders}건${memo}`);
      });
      (d.exp || []).forEach(e => { const q=parseInt(e.qty)||0; totalExp+=q; if(e.name) expLines.push(`${e.name} ${q}건 (${e.status})`); });
    }
    if (m.type === 'design' && m.status !== 'leave') {
      (d.brands || []).forEach(b => {
        if (!dsummary[b.brand]) dsummary[b.brand] = { done: 0, wip: 0, members: [] };
        dsummary[b.brand].done += parseInt(b.done)||0;
        dsummary[b.brand].wip += parseInt(b.wip)||0;
      });
    }
  });

  const totalDesign = Object.values(dsummary).reduce((a,v)=>a+v.done,0);

  let html = `
    <div id="exportTarget">
    <div class="sum-header">
      <div class="sum-title-block">
        <div class="company">Team Weekly Report</div>
        <div class="week">${wRange()} 주간 업무 보고서</div>
      </div>
      <div class="sum-badge-report">WEEKLY</div>
    </div>

    <div class="sum-stat-row">
      <div class="sum-stat">
        <div class="val">${totalSales > 0 ? totalSales.toLocaleString()+'원' : '—'}</div>
        <div class="lbl">총 매출 합계</div>
      </div>
      <div class="sum-stat">
        <div class="val">${totalExp > 0 ? totalExp+'건' : '—'}</div>
        <div class="lbl">체험단 총 건수</div>
      </div>
      <div class="sum-stat">
        <div class="val">${totalDesign > 0 ? totalDesign+'건' : '—'}</div>
        <div class="lbl">디자인 완료</div>
      </div>
    </div>`;

  // Marketing
  const mktMember = DB.members.find(m=>m.type==='marketing');
  const mktData = mktMember ? ((w.members||{})[mktMember.id]||{}) : {};
  const customStores = mktData.customStores || [];
  const allStores = [...STORES_FIXED, ...customStores];
  const storeData = mktData.storeData || {};

  html += `<div class="sum-section"><div class="sum-section-title">마케팅 — 스마트스토어 매출 (${mktMember?.name||'공수진'})</div>`;
  html += `<table class="sum-table"><thead><tr><th>스토어</th><th style="width:110px;text-align:right">매출</th><th style="width:70px;text-align:center">발주</th></tr></thead><tbody>`;
  allStores.forEach(s => {
    const sd = storeData[s] || {};
    const v = parseInt(sd.amt)||0;
    const o = parseInt(sd.orders)||0;
    html += `<tr><td>${s}</td><td style="text-align:right">${v.toLocaleString()}원</td><td style="text-align:center">${o}건</td></tr>`;
  });
  html += `<tr style="font-weight:600"><td>합계</td><td style="text-align:right">${totalSales.toLocaleString()}원</td><td></td></tr>`;
  html += `</tbody></table></div>`;

  if (expLines.length) {
    html += `<div class="sum-section"><div class="sum-section-title">마케팅 — 체험단 현황</div><div class="sum-lines">${expLines.join('\n')}</div></div>`;
  }

  if (mktData.mktEtc) {
    html += `<div class="sum-section"><div class="sum-section-title">마케팅 — 기타 업무</div><div class="sum-lines">${mktData.mktEtc}</div></div>`;
  }

  // Design
  html += `<div class="sum-section"><div class="sum-section-title">디자인 — 이번 주 브랜드별 작업</div>`;
  if (Object.keys(dsummary).length) {
    html += `<table class="sum-table"><thead><tr><th>브랜드</th><th style="width:80px;text-align:center">완료</th><th style="width:80px;text-align:center">미작업</th></tr></thead><tbody>`;
    Object.entries(dsummary).forEach(([b,v]) => {
      html += `<tr><td>${b}</td><td style="text-align:center">${v.done}</td><td style="text-align:center">${v.wip}</td></tr>`;
    });
    html += `</tbody></table>`;
  } else html += `<div class="sum-empty">입력된 데이터 없음</div>`;
  html += `</div>`;

  // Next week design
  const designMembers = DB.members.filter(m=>m.type==='design'&&m.status!=='leave');
  let nextHtml = '';
  designMembers.forEach(m => {
    const d = (w.members||{})[m.id]||{};
    if (d.nextBrands && d.nextBrands.length) {
      nextHtml += `<div class="sum-person-block"><div class="sum-person-name">${m.name}</div><div class="sum-person-items">${d.nextBrands.map(b=>`· ${b.brand}${b.done?` ${b.done}건`:''}`).join('<br>')}</div></div>`;
    }
  });
  if (nextHtml) html += `<div class="sum-section"><div class="sum-section-title">디자인 — 다음 주 예정 작업</div>${nextHtml}</div>`;

  // Mgr memo
  if (w.mgrNote || w.mgrNext) {
    html += `<div class="sum-section"><div class="sum-section-title">특이사항 / 일정</div>`;
    if (w.mgrNote) html += `<div class="sum-lines" style="margin-bottom:.75rem">${w.mgrNote}</div>`;
    if (w.mgrNext) html += `<div class="sum-section-title" style="margin-top:.5rem">다음 주 주요 일정</div><div class="sum-lines">${w.mgrNext}</div>`;
    html += `</div>`;
  }

  html += `<div style="text-align:right;font-size:11px;color:var(--text-3);margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)">생성일: ${new Date().toLocaleDateString('ko-KR')} · Team Report</div>
  </div>`;

  document.getElementById('sumExportCard').innerHTML = html;
}

// ═══ EXPORT ═══
function copySummary() {
  const w = gw();
  let txt = `[${wRange()} 주간 업무 보고]\n\n`;
  DB.members.forEach(m => {
    const d = (w.members||{})[m.id]||{};
    if (m.type==='marketing') {
      txt += `■ 마케팅 (${m.name})\n[스마트스토어 매출]\n`;
      const customStores = d.customStores || [];
      const allStores = [...STORES_FIXED, ...customStores];
      const storeData = d.storeData || {};
      allStores.forEach(s => {
        const sd = storeData[s] || {};
        txt += `· ${s}: ${(parseInt(sd.amt)||0).toLocaleString()}원, 발주 ${parseInt(sd.orders)||0}건${sd.memo?' ('+sd.memo+')':''}\n`;
      });
      if(d.exp?.length){txt+='\n[체험단]\n';d.exp.forEach(e=>{if(e.name)txt+=`· ${e.name} ${e.qty}건 (${e.status})\n`;});}
      if(d.mktEtc){txt+='\n[기타]\n'+d.mktEtc+'\n';}
      txt+='\n';
    }
  });
  txt += `■ 디자인 작업 현황\n`;
  const ds={};
  DB.members.filter(m=>m.type==='design'&&m.status!=='leave').forEach(m=>{
    const d=(w.members||{})[m.id]||{};
    (d.brands||[]).forEach(b=>{if(!ds[b.brand])ds[b.brand]={done:0,wip:0};ds[b.brand].done+=parseInt(b.done)||0;ds[b.brand].wip+=parseInt(b.wip)||0;});
  });
  Object.entries(ds).forEach(([b,v])=>{txt+=`· ${b}: 완료 ${v.done}건, 미작업 ${v.wip}건\n`;});
  txt+='\n[다음 주 예정]\n';
  DB.members.filter(m=>m.type==='design'&&m.status!=='leave').forEach(m=>{
    const d=(w.members||{})[m.id]||{};
    if(d.nextBrands?.length){txt+=`${m.name}: ${d.nextBrands.map(b=>b.brand+(b.done?` ${b.done}건`:'')).join(', ')}\n`;}
  });
  if(w.mgrNote||w.mgrNext){txt+=`\n■ 특이사항\n`;if(w.mgrNote)txt+=w.mgrNote+'\n';if(w.mgrNext)txt+='\n[다음 주]\n'+w.mgrNext+'\n';}
  navigator.clipboard.writeText(txt).then(()=>toast('클립보드에 복사됐습니다')).catch(()=>toast('복사 실패'));
}

function downloadJpg() {
  const el = document.getElementById('exportTarget');
  if (!el) { toast('먼저 요약본을 열어주세요'); return; }
  toast('JPG 생성 중...');
  // 구글 폰트 등 외부 리소스 제외하고 캡처
  html2canvas(el, {
    scale: 2,
    backgroundColor: '#ffffff',
    useCORS: false,
    allowTaint: true,
    logging: false,
    onclone: (doc) => {
      // 폰트를 시스템 폰트로 교체해 렌더링 오류 방지
      doc.body.style.fontFamily = 'sans-serif';
    }
  }).then(canvas => {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const weekStr = wRange().replace(/[\/\s]/g, '-');
      a.download = `주간보고_${weekStr}.jpg`;
      a.href = url;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('JPG 다운로드 완료');
    }, 'image/jpeg', 0.92);
  }).catch(e => { console.error(e); toast('다운로드 실패: ' + e.message); });
}

    // 주차 변경과 무관한 패널 — 갱신 불필요
  } else if (currentPanel === 'report') {
    // 주간보고 주차 뷰가 열려있을 때만 갱신

}

// ═══ CHANNEL HELPERS ═══
// 공통: 매체별 월 목록 렌더 (인스타/네이버/카카오 공용)
function makeChannelModule(opts) {
  // opts: { key, label, color, containerId, renderWrite, renderDetail, calcTotal }
  const key = opts.key; // 'instaReports' | 'naverReports' | 'kakaoReports'
  const state = { view: 'list', detailId: null, editId: null, year: new Date().getFullYear() };

  function getEl() { return document.getElementById(opts.containerId); }

  function renderView() {
    if (state.view === 'list') renderList();
    else if (state.view === 'write') opts.renderWrite(state, save2, renderView, getEl);
    else if (state.view === 'detail') renderDetail();
  }

  function renderList() {
    const el = getEl();
    const all = DB[key] || [];
    const years = [...new Set(all.map(r => r.month?.slice(0,4)))].sort((a,b)=>b-a);
    if (!years.includes(String(state.year))) state.year = years[0] || new Date().getFullYear();
    const filtered = all.filter(r => r.month?.startsWith(state.year+'-'))
      .sort((a,b) => b.month.localeCompare(a.month));

    const months = Array.from({length:12},(_,i)=>i+1);
    const existing = new Set(filtered.map(r=>r.month));

    el.innerHTML = `
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
        <div><h2 style="display:flex;align-items:center;gap:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${opts.color}"></span>${opts.label}</h2>
          <div class="subtitle">월별 광고 집행 내역</div></div>
        <button class="btn-primary" onclick="window._ch_${key}.newEntry()">+ 월 데이터 추가</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem">
        ${(years.length ? years : [new Date().getFullYear()]).map(y=>`
          <button class="${y==state.year?'btn-primary':'btn-secondary'}" style="padding:5px 14px;font-size:12px"
            onclick="window._ch_${key}.setYear(${y})">${y}년</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem">
        ${months.map(m => {
          const preset = `${state.year}-${String(m).padStart(2,'0')}`;
          const r = filtered.find(r=>r.month===preset);
          const total = r ? (opts.calcTotal ? opts.calcTotal(r) : 0) : 0;
          return `<div class="card" style="padding:1rem;cursor:pointer;border:1px solid var(--border);transition:box-shadow .15s${r?'':';opacity:.45'}"
            onclick="${r?`window._ch_${key}.openDetail(${r.id})`:`window._ch_${key}.newEntry('${preset}')`}"
            onmouseenter="this.style.boxShadow='0 4px 14px rgba(0,0,0,0.09)'" onmouseleave="this.style.boxShadow=''">
            <div style="font-size:11px;color:var(--text-3);margin-bottom:.25rem">${m}월</div>
            ${r
              ? `<div style="font-size:15px;font-weight:700;color:var(--text)">${total>0?total.toLocaleString()+'원':'입력됨'}</div>
                 <div style="font-size:11px;color:var(--text-3);margin-top:2px">${r.date||''}</div>`
              : `<div style="font-size:13px;color:var(--text-3)">미입력</div>`
            }
          </div>`;
        }).join('')}
      </div>`;
  }

  function renderDetail() {
    opts.renderDetail(state, DB[key], save2, renderView, getEl);
  }

  function save2() { save(); }

  return {
    init() { if(!DB[key]) DB[key]=[]; state.view='list'; renderView(); },
    setYear(y) { state.year=y; renderView(); },
    newEntry(preset) {
      state.editId=null;
      state.view='write';
      state._preset=preset||`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
      renderView();
    },
    openDetail(id) { state.detailId=id; state.view='detail'; renderView(); },
    openEdit(id) { state.editId=id; state.view='write'; renderView(); },
    goList() { state.view='list'; renderView(); },
    goDetail() { state.view='detail'; renderView(); },
    deleteEntry(id) {
      if(!confirm('삭제할까요?')) return;
      DB[key]=(DB[key]||[]).filter(r=>r.id!==id);
      save(); state.view='list'; renderView(); toast('삭제됐습니다');
    }
  };
}

function submitInsta(editId) {
  const month = document.getElementById('instaMonth').value;
  if (!month) { toast('광고 기간(월)을 선택해주세요'); return; }
  const accounts = [];
  document.querySelectorAll('.ar-insta-account').forEach(accEl => {
    const summary = {
      limit: accEl.querySelector('.ar-sum-limit')?.value||'',
      dailyBudget: accEl.querySelector('.ar-sum-daily')?.value||'',
      adCost: accEl.querySelector('.ar-sum-cost')?.value||'',
      totalKRW: accEl.querySelector('.ar-sum-krw')?.value||'',
      totalUSD: accEl.querySelector('.ar-sum-usd')?.value||'',
      remaining: accEl.querySelector('.ar-sum-rem')?.value||'',
    };
    const ads = [];
    accEl.querySelectorAll('.ar-insta-row').forEach(row => {
      const sel=row.querySelector('select'), ins=row.querySelectorAll('input');
      if (ins[0]?.value) ads.push({status:sel?.value||'완료',name:ins[0]?.value||'',startDate:ins[1]?.value||'',endDate:ins[2]?.value||'',reach:ins[3]?.value||'',playOrImp:ins[4]?.value||'',cpm:ins[5]?.value||'',target:ins[6]?.value||'',dailyBudget:ins[7]?.value||'',totalKRW:ins[8]?.value||'',totalUSD:ins[9]?.value||'',url:ins[10]?.value||''});
    });
    accounts.push({ name:accEl.querySelector('.ar-insta-acc-name')?.value||'', summary, ads });
  });
  if (!DB.instaReports) DB.instaReports = [];
  if (editId) {
    const r = DB.instaReports.find(r=>r.id===editId);
    if (r) { r.month=month; r.accounts=accounts; r.date=new Date().toLocaleDateString('ko-KR'); }
    window._ch_instaReports.openDetail(editId);
  } else {
    const id = Date.now();
    DB.instaReports.unshift({id, month, accounts, date:new Date().toLocaleDateString('ko-KR')});
    window._ch_instaReports.openDetail(id);
  }
  save(); toast('저장됐습니다');
}

function copyInstaData(id) {
  const r = (DB.instaReports||[]).find(r=>r.id===id);
  if (!r) return;
  let txt = `${formatAdMonth(r.month)} 인스타그램 광고 데이터\n${'='.repeat(40)}\n\n`;
  (r.accounts||[]).forEach(acc=>{
    txt+=`▶ 계정: ${acc.name}\n`;
    const s=acc.summary||{};
    if(s.limit)txt+=`  광고한도: ${s.limit}\n`;if(s.totalKRW)txt+=`  총지출(₩): ${s.totalKRW}\n`;if(s.totalUSD)txt+=`  총지출($): ${s.totalUSD}\n`;if(s.remaining)txt+=`  잔여: ${s.remaining}\n`;
    (acc.ads||[]).forEach(ad=>{txt+=`  - ${ad.name||''} (${ad.status||''}) 도달:${ad.reach||'-'} CPM:${ad.cpm||'-'} 총지출:${ad.totalKRW||'-'}₩\n`;});

function copyNaverData(id) {
  const r=(DB.naverReports||[]).find(r=>r.id===id);

  let txt=`${formatAdMonth(r.month)} 네이버 검색광고 데이터\n${'='.repeat(40)}\n\n`;
  const s=r.summary||{};
  if(s.limit)txt+=`광고한도: ${s.limit}원\n`;if(s.totalImp)txt+=`총노출: ${s.totalImp}\n`;if(s.totalClicks)txt+=`총클릭: ${s.totalClicks}\n`;if(s.totalCost)txt+=`총지출: ${s.totalCost}원\n`;if(s.remaining)txt+=`잔여: ${s.remaining}원\n`;
  (r.campaigns||[]).forEach(c=>{txt+=`- ${c.name||''} (${c.status||''}) 노출:${c.impressions||'-'} 클릭:${c.clicks||'-'} CTR:${c.ctr||'-'}% CPC:${c.cpc||'-'}원\n`;});
  if(r.memo)txt+=`\n메모: ${r.memo}\n`;
  txt+=`\n${'='.repeat(40)}\n위 네이버 검색광고 데이터를 분석해주세요. 키워드별 효율 비교, 성과 좋은 캠페인과 개선이 필요한 캠페인, 다음 달 운영 제안을 포함해주세요.`;

}

function copyKakaoData(id) {
  const r=(DB.kakaoReports||[]).find(r=>r.id===id);
  if(!r)return;
  let txt=`${formatAdMonth(r.month)} 카카오 배너광고 데이터\n${'='.repeat(40)}\n\n`;
  const s=r.summary||{};
  if(s.limit)txt+=`광고한도: ${s.limit}원\n`;if(s.totalImp)txt+=`총노출: ${s.totalImp}\n`;if(s.totalClicks)txt+=`총클릭: ${s.totalClicks}\n`;if(s.totalCost)txt+=`총지출: ${s.totalCost}원\n`;if(s.reward)txt+=`보상환급: ${s.reward}원\n`;if(s.remaining)txt+=`잔여: ${s.remaining}원\n`;
  (r.ads||[]).forEach(a=>{txt+=`- ${a.name||''} (${a.status||''}) 노출:${a.impressions||'-'} 클릭:${a.clicks||'-'} CTR:${a.ctr||'-'}% 총비용:${a.totalCost||'-'}원\n`;});
  if(r.memo)txt+=`\n메모: ${r.memo}\n`;
  txt+=`\n${'='.repeat(40)}\n위 카카오 배너광고 데이터를 분석해주세요. 광고별 효율 비교, 성과 좋은 광고와 개선이 필요한 광고, 다음 달 운영 제안을 포함해주세요.`;
  navigator.clipboard.writeText(txt).then(()=>toast('복사됐습니다. AI 툴에 붙여넣으세요!'));
}

      ${Array.from({length:12},(_,i)=>i+1).map(m => {
        const preset = `${y}-${String(m).padStart(2,'0')}`;
        const insta = (DB.instaReports||[]).find(r=>r.month===preset);
        const naver = (DB.naverReports||[]).find(r=>r.month===preset);
        const kakao = (DB.kakaoReports||[]).find(r=>r.month===preset);
        const hasAny = insta||naver||kakao;
        let total = 0;
        if(insta)(insta.accounts||[]).forEach(acc=>total+=parseKRW(acc.summary?.totalKRW));
        if(naver)total+=parseKRW(naver.summary?.totalCost);
        if(kakao)total+=parseKRW(kakao.summary?.totalCost);
        const tags=[insta&&'📸',naver&&'🔵',kakao&&'💛'].filter(Boolean);

             </div>`;
      }).join('')}
    </div>`;
}

function calcAdTotal(r) {
  let t = 0;
  const parseKRW = v => parseInt((v||'').toString().replace(/[^0-9]/g,''))||0;
  // 신규 구조
  (r.instaAccounts||[]).forEach(acc => { t += parseKRW(acc.summary?.totalKRW); });
  t += parseKRW(r.naverSummary?.totalCost);
  t += parseKRW(r.kakaoSummary?.totalCost);
  // 구 구조 호환
  if (r.insta?.spend) t += parseInt(r.insta.spend)||0;
  if (r.naver?.spend) t += parseInt(r.naver.spend)||0;
  if (r.kakao?.spend) t += parseInt(r.kakao.spend)||0;
  return t;
}

function formatAdMonth(ym) {
  if (!ym) return '—';
  const [y, m] = ym.split('-');
  return `${y}년 ${parseInt(m)}월`;
}

function printAdReport() {
  window.print();

function downloadAdReportImg(month) {
  const el = document.getElementById('adReportPrintArea');
  if (!el) return;
  toast('이미지 생성 중...');
  html2canvas(el, { scale:2, backgroundColor:'#ffffff', useCORS:false, allowTaint:true, logging:false,
    onclone: doc => { doc.body.style.fontFamily='sans-serif'; }
  }).then(canvas => {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = `광고보고서_${month}.jpg`;
      a.href = url;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      toast('이미지 저장 완료');
    }, 'image/jpeg', 0.92);
  }).catch(e => toast('저장 실패: '+e.message));
}

function copyAdReportDataNew(month) {
  const insta=(DB.instaReports||[]).find(r=>r.month===month);
  const naver=(DB.naverReports||[]).find(r=>r.month===month);
  const kakao=(DB.kakaoReports||[]).find(r=>r.month===month);
  let txt=`${formatAdMonth(month)} 통합 광고 데이터\n${'='.repeat(40)}\n\n`;
  if(insta){
    txt+='[인스타그램]\n';
    (insta.accounts||[]).forEach(acc=>{
      txt+=`▶ ${acc.name}\n`;
      const s=acc.summary||{};
      if(s.totalKRW)txt+=`  총지출: ${s.totalKRW}₩\n`;
      (acc.ads||[]).forEach(ad=>txt+=`  - ${ad.name||''} 도달:${ad.reach||'-'} CPM:${ad.cpm||'-'} 지출:${ad.totalKRW||'-'}₩\n`);
    });txt+='\n';
  }
  if(naver){
    txt+='[네이버]\n';const s=naver.summary||{};
    if(s.totalCost)txt+=`총지출: ${s.totalCost}원\n`;
    (naver.campaigns||[]).forEach(c=>txt+=`- ${c.name||''} 클릭:${c.clicks||'-'} CPC:${c.cpc||'-'}원\n`);txt+='\n';
  }
  if(kakao){
    txt+='[카카오]\n';const s=kakao.summary||{};
    if(s.totalCost)txt+=`총지출: ${s.totalCost}원\n`;
    (kakao.ads||[]).forEach(a=>txt+=`- ${a.name||''} 노출:${a.impressions||'-'} 클릭:${a.clicks||'-'} 지출:${a.totalCost||'-'}원\n`);txt+='\n';
  }
  txt+=`${'='.repeat(40)}\n위 데이터를 분석해주세요. 매체별 효율 비교, 다음 달 예산 배분 제안을 포함해주세요.`;
  navigator.clipboard.writeText(txt).then(()=>toast('복사됐습니다. AI 툴에 붙여넣으세요!'));
}

function submitAdReport() {
  const month = document.getElementById('arMonth').value;
  if (!month) { toast('광고 기간(월)을 선택해주세요'); return; }
  const g = id => document.getElementById(id)?.value||'';

  // 인스타 계정 수집
  const instaAccounts = [];
  document.querySelectorAll('.ar-insta-account').forEach(accEl => {
    const summary = {
      limit: accEl.querySelector('.ar-sum-limit')?.value||'',
      dailyBudget: accEl.querySelector('.ar-sum-daily')?.value||'',
      adCost: accEl.querySelector('.ar-sum-cost')?.value||'',
      totalKRW: accEl.querySelector('.ar-sum-krw')?.value||'',
      totalUSD: accEl.querySelector('.ar-sum-usd')?.value||'',
      remaining: accEl.querySelector('.ar-sum-rem')?.value||'',
    };
    const ads = [];
    accEl.querySelectorAll('.ar-insta-row').forEach(row => {
      const sel=row.querySelector('select'), ins=row.querySelectorAll('input');
      if (ins[0]?.value||ins[1]?.value) ads.push({
        status:sel?.value||'완료', name:ins[0]?.value||'', startDate:ins[1]?.value||'', endDate:ins[2]?.value||'',
        reach:ins[3]?.value||'', playOrImp:ins[4]?.value||'', cpm:ins[5]?.value||'', target:ins[6]?.value||'',
        dailyBudget:ins[7]?.value||'', totalKRW:ins[8]?.value||'', totalUSD:ins[9]?.value||'', url:ins[10]?.value||''
      });
    });
    instaAccounts.push({ name:accEl.querySelector('.ar-insta-acc-name')?.value||'', summary, ads });
  });

  // 네이버 수집
  const naverSummary = { limit:g('ar_nav_limit'), totalImp:g('ar_nav_imp'), totalClicks:g('ar_nav_clicks'), totalCost:g('ar_nav_cost'), remaining:g('ar_nav_rem') };
  const naverCampaigns = [];
  document.querySelectorAll('#arNaverRows tr').forEach(row => {
    const sel=row.querySelector('select'), ins=row.querySelectorAll('input');
    if (ins[0]?.value) naverCampaigns.push({ status:sel?.value||'완료', name:ins[0]?.value||'', startDate:ins[1]?.value||'', endDate:ins[2]?.value||'', impressions:ins[3]?.value||'', clicks:ins[4]?.value||'', ctr:ins[5]?.value||'', cpc:ins[6]?.value||'', campaignType:ins[7]?.value||'', totalCost:ins[8]?.value||'', remaining:ins[9]?.value||'' });
  });

  // 카카오 수집
  const kakaoSummary = { limit:g('ar_kak_limit'), totalImp:g('ar_kak_imp'), totalClicks:g('ar_kak_clicks'), totalCost:g('ar_kak_cost'), reward:g('ar_kak_reward'), remaining:g('ar_kak_rem') };
  const kakaoAds = [];
  document.querySelectorAll('#arKakaoRows tr').forEach(row => {
    const sel=row.querySelector('select'), ins=row.querySelectorAll('input');
    if (ins[0]?.value) kakaoAds.push({ status:sel?.value||'완료', name:ins[0]?.value||'', startDate:ins[1]?.value||'', endDate:ins[2]?.value||'', impressions:ins[3]?.value||'', clicks:ins[4]?.value||'', ctr:ins[5]?.value||'', reach:ins[6]?.value||'', cpc:ins[7]?.value||'', cpr:ins[8]?.value||'', totalCost:ins[9]?.value||'', reward:ins[10]?.value||'' });
  });

  const reportData = { month, instaAccounts, naverSummary, naverCampaigns, naverMemo:g('arNaverMemo'), kakaoSummary, kakaoAds, kakaoMemo:g('arKakaoMemo'), summary:g('arSummary') };
  if (!DB.adReports) DB.adReports = [];
  if (adReportEditId) {
    const r = DB.adReports.find(r=>r.id===adReportEditId);
    if (r) Object.assign(r, reportData);
    adReportDetailId = adReportEditId;
    adReportEditId = null;
    save(); adReportView='detail'; renderAdReportView();
    toast('보고서가 수정됐습니다');
  } else {
    DB.adReports.unshift({ id:Date.now(), date:new Date().toLocaleDateString('ko-KR'), ...reportData });
    save(); adReportView='list'; renderAdReportView();
    toast('보고서가 등록됐습니다');
  }
}

function copyAdReportData(id) {
  const r = (DB.adReports||[]).find(r => r.id === id);
  if (!r) return;
  let txt = `${formatAdMonth(r.month)} 광고 집행 데이터\n${'='.repeat(40)}\n\n`;

  // 인스타
  if (r.instaAccounts?.length) {
    txt += `[인스타그램 광고]\n`;
    r.instaAccounts.forEach(acc => {
      txt += `\n▶ 계정: ${acc.name}\n`;
      const s = acc.summary||{};
      if (s.limit) txt += `  광고한도: ${s.limit}\n`;
      if (s.dailyBudget) txt += `  일예산합: ${s.dailyBudget}\n`;
      if (s.adCost) txt += `  광고비용: ${s.adCost}\n`;
      if (s.totalKRW) txt += `  총지출(₩): ${s.totalKRW}\n`;
      if (s.totalUSD) txt += `  총지출($): ${s.totalUSD}\n`;
      if (s.remaining) txt += `  잔여: ${s.remaining}\n`;
      if (acc.ads?.length) {
        txt += `  광고 목록:\n`;
        acc.ads.forEach(ad => {
          txt += `  - ${ad.name||''} (${ad.status||''}) ${ad.startDate||''}${ad.endDate?`~${ad.endDate}`:''} / 도달:${ad.reach||'-'} CPM:${ad.cpm||'-'} 총지출:${ad.totalKRW||'-'}₩ ${ad.totalUSD||'-'}$\n`;
        });
      }
    });
    txt += '\n';
  }

  // 네이버
  const ns = r.naverSummary||{};
  if (r.naverCampaigns?.length || Object.values(ns).some(v=>v)) {
    txt += `[네이버 검색광고]\n`;
    if (ns.limit) txt += `  광고한도: ${ns.limit}원\n`;
    if (ns.totalImp) txt += `  총노출: ${ns.totalImp}\n`;
    if (ns.totalClicks) txt += `  총클릭: ${ns.totalClicks}\n`;
    if (ns.totalCost) txt += `  총지출: ${ns.totalCost}원\n`;
    if (ns.remaining) txt += `  잔여: ${ns.remaining}원\n`;
    if (r.naverCampaigns?.length) {
      txt += `  캠페인 목록:\n`;
      r.naverCampaigns.forEach(c => {
        txt += `  - ${c.name||''} (${c.status||''}) 노출:${c.impressions||'-'} 클릭:${c.clicks||'-'} CTR:${c.ctr||'-'}% CPC:${c.cpc||'-'}원 총비용:${c.totalCost||'-'}원\n`;
      });
    }
    if (r.naverMemo) txt += `  메모: ${r.naverMemo}\n`;
    txt += '\n';
  }

  // 카카오
  const ks = r.kakaoSummary||{};
  if (r.kakaoAds?.length || Object.values(ks).some(v=>v)) {
    txt += `[카카오 배너광고]\n`;
    if (ks.limit) txt += `  광고한도: ${ks.limit}원\n`;
    if (ks.totalImp) txt += `  총노출: ${ks.totalImp}\n`;
    if (ks.totalClicks) txt += `  총클릭: ${ks.totalClicks}\n`;
    if (ks.totalCost) txt += `  총지출: ${ks.totalCost}원\n`;
    if (ks.reward) txt += `  보상환급: ${ks.reward}원\n`;
    if (ks.remaining) txt += `  잔여: ${ks.remaining}원\n`;
    if (r.kakaoAds?.length) {
      txt += `  광고 목록:\n`;
      r.kakaoAds.forEach(a => {
        txt += `  - ${a.name||''} (${a.status||''}) 노출:${a.impressions||'-'} 클릭:${a.clicks||'-'} CTR:${a.ctr||'-'}% 총비용:${a.totalCost||'-'}원\n`;
      });
    }
    if (r.kakaoMemo) txt += `  메모: ${r.kakaoMemo}\n`;
    txt += '\n';
  }

  if (r.summary) txt += `[총평]\n${r.summary}\n\n`;

  txt += `${'='.repeat(40)}\n위 데이터를 분석해주세요.\n매체별 효율 비교, 잘된 광고와 아쉬운 광고, 다음 달 예산 배분 제안을 포함해주세요.`;

  navigator.clipboard.writeText(txt).then(() => toast('데이터가 복사됐습니다. AI 툴에 붙여넣으세요!'));
}

async function runAdAnalysis() {
  const apiKey = localStorage.getItem('ad_api_key');
  if (!apiKey) {
    toast('먼저 API 키를 설정해주세요');
    document.getElementById('adKeyPanel').style.display = 'block';
    return;
  }
  const insta = document.getElementById('adInsta').value.trim();
  const naver = document.getElementById('adNaver').value.trim();
  const kakao = document.getElementById('adKakao').value.trim();
  if (!insta && !naver && !kakao) { toast('최소 하나의 광고 데이터를 입력해주세요'); return; }

  const btn = document.getElementById('btnAnalyze');
  btn.disabled = true;
  btn.textContent = '분석 중...';

  document.getElementById('adResult').innerHTML = `
    <div class="card">
      <div class="ad-loading">
        <div class="ad-loading-dots">
          <div class="ad-loading-dot"></div>
          <div class="ad-loading-dot"></div>
          <div class="ad-loading-dot"></div>
        </div>
        <div style="font-size:13px;color:var(--text-2)">AI가 광고 데이터를 분석하고 있습니다...</div>
      </div>
    </div>`;

  const titleInput = document.getElementById('adTitle').value.trim();
  const now = new Date();
  const defaultTitle = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 광고 분석`;
  const analysisTitle = titleInput || defaultTitle;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4000,
        messages: [{ role: 'user', content: buildAdPrompt(insta, naver, kakao) }]
      })
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }
    const data = await response.json();
    const resultText = data.content[0].text;

    // 기록 저장
    if (!DB.adAnalysisLogs) DB.adAnalysisLogs = [];
    DB.adAnalysisLogs.unshift({
      id: Date.now(),
      title: analysisTitle,
      date: now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }),
      dateTime: now.toISOString(),
      insta, naver, kakao,
      result: resultText
    });
    save();

    renderAdResult(resultText);
    toast('분석 완료 · 기록에 저장됐습니다');
  } catch(e) {
    document.getElementById('adResult').innerHTML =
      `<div class="card"><p style="color:var(--red-tx);font-size:13px">오류: ${e.message}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '✦ AI 분석하기';
  }
}

function buildAdPrompt(insta, naver, kakao) {
  const now = new Date();
  const monthStr = `${now.getFullYear()}년 ${now.getMonth()+1}월`;
  let data = '';
  if (insta) data += `\n\n[인스타그램 광고 데이터]\n${insta}`;
  if (naver) data += `\n\n[네이버 검색광고 데이터]\n${naver}`;
  if (kakao) data += `\n\n[카카오 배너 데이터]\n${kakao}`;
  return `아래는 ${monthStr} 광고 집행 결과입니다.${data}

위 데이터를 기반으로 아래 항목을 분석해주세요. 데이터가 없는 매체는 "데이터 없음"으로 표시하세요.

## 1. 매체별 총 지출 및 효율 요약
- 인스타그램: 총 지출 / 총 도달 / 평균 CPM
- 네이버: 총 지출 / 클릭수 / 평균 CPC
- 카카오: 총 지출 / 도달수 / 클릭당 비용

## 2. 브랜드별 광고 성과
나인원코스메디 / 리블 / 바이탈메디 각각 비교 (데이터에 브랜드 구분이 없으면 전체 기준으로 분석)

## 3. 소재 유형별 효율
릴스 vs 이미지 vs 쇼츠 비교 (해당 데이터가 없으면 가능한 범위에서 분석)

## 4. 이번 달 잘된 것 / 아쉬운 것
- 성과 상위 3개 광고 (이유 포함)
- 성과 하위 3개 광고 + 구체적 개선 제안

## 5. 다음 달 예산 배분 제안
- 매체별 추천 예산 및 근거
- 집중해야 할 브랜드
- 새로 시도해볼 소재 방향

## 6. 퍼포먼스 마케팅 관점 제안
- 타겟 세분화 제안
- A/B 테스트 추천 소재
- 시즌 이슈 활용 방안

숫자 근거를 명확히 제시하고, 실무에서 바로 적용 가능한 구체적인 인사이트로 작성해주세요.`;
}

        <button class="btn-secondary" style="font-size:12px" onclick="copyAdResult()">📋 복사</button>
      </div>
      <div style="font-size:13px;line-height:1.9;color:var(--text)">${html}</div>
    </div>`;
}

function copyAdResult() {
  if (!window._adResultText) return;
  navigator.clipboard.writeText(window._adResultText).then(() => toast('분석 결과가 복사됐습니다'));
}

// ═══ DASHBOARD ═══
function initDashboard() { renderDashboard(); }

function renderDashboard() {
  const el = document.getElementById('dashContainer');
  const now = new Date();
  const dateStr = now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  const taskInProgress = (DB.tasks || []).filter(t => t.status === '진행중').length;
  const noticeCount = (DB.notices || []).length;
  const activeMembers = DB.members.filter(m => m.status === 'active').length;

  const recentNotices = [...(DB.notices || [])].sort((a,b) => b.id - a.id).slice(0, 4);

    .filter(t => t.status !== '완료' && t.deadline)
    .sort((a,b) => a.deadline.localeCompare(b.deadline))
    .slice(0, 4);

  el.innerHTML = `

    <div class="dash-stat-grid">
      <div class="dash-stat-card" onclick="showReportPanel()">

        <div class="dash-stat-val">${activeMembers}명</div>
        <div class="dash-stat-lbl">이번 주 보고 팀원</div>
      </div>
      <div class="dash-stat-card" onclick="showPanel('tasks')">
        <div class="dash-stat-icon">📁</div>
        <div class="dash-stat-val">${taskInProgress}건</div>
        <div class="dash-stat-lbl">진행 중인 업무</div>
      </div>
      <div class="dash-stat-card" onclick="showPanel('notice')">
        <div class="dash-stat-icon">📢</div>
        <div class="dash-stat-val">${noticeCount}건</div>
        <div class="dash-stat-lbl">전체 공지사항</div>
      </div>
      <div class="dash-stat-card" onclick="openLocked('ad')">
        <div class="dash-stat-icon">✦</div>
        <div class="dash-stat-val">${adLogCount}건</div>
        <div class="dash-stat-lbl">AI 분석 기록</div>
      </div>
    </div>

    <div class="dash-row">
      <div class="card">
        <div class="dash-section-title">
          최근 공지사항
          <span class="dash-more" onclick="showPanel('notice')">더보기 →</span>
        </div>
        ${recentNotices.length === 0
          ? `<div class="dash-empty">등록된 공지사항이 없습니다</div>`
          : recentNotices.map(n => `
            <div class="dash-list-item" onclick="noticeDetailId=${n.id};noticeView='detail';showPanel('notice')">
              ${n.important ? `<span class="badge" style="background:var(--red-bg);color:var(--red-tx);flex-shrink:0">중요</span>` : ''}
              <span class="dash-item-title">${n.title}</span>
              <span class="dash-item-meta">${n.date}</span>
            </div>`).join('')
        }
      </div>

      <div class="card">
        <div class="dash-section-title">
          마감 임박 업무
          <span class="dash-more" onclick="showPanel('tasks')">더보기 →</span>
        </div>
        ${deadlineTasks.length === 0
          ? `<div class="dash-empty">마감일이 있는 업무가 없습니다</div>`
          : deadlineTasks.map(t => {
              const sc = t.status === '완료' ? 'teal' : t.status === '대기' ? 'amber' : 'blue';
              return `<div class="dash-list-item" onclick="taskDetailId=${t.id};taskView='detail';showPanel('tasks')">
                <span class="badge" style="background:var(--${sc}-bg);color:var(--${sc}-tx);flex-shrink:0">${t.status}</span>
                <span class="dash-item-title">${t.title}</span>
